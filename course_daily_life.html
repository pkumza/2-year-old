<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生活小帮手</title>
  <style>
    :root {
      --paper: #fffdf7;
      --ink: #253047;
      --soft: #6b7280;
      --line: #e8dccb;
      --blue: #60a5fa;
      --pink: #fb7185;
      --green: #34d399;
      --yellow: #facc15;
      --orange: #fb923c;
      --purple: #a78bfa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 16%, rgba(96, 165, 250, 0.18), transparent 25%),
        radial-gradient(circle at 82% 12%, rgba(250, 204, 21, 0.24), transparent 22%),
        radial-gradient(circle at 78% 88%, rgba(52, 211, 153, 0.18), transparent 28%),
        var(--paper);
    }

    main {
      width: min(1040px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      padding: 8px 0 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 60px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--soft);
      font-size: 18px;
    }

    .counter {
      min-width: 132px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      font-size: 18px;
      font-weight: 900;
      text-align: center;
    }

    .card {
      display: none;
      min-height: 548px;
      padding: clamp(18px, 4vw, 34px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.93);
      box-shadow: 0 18px 48px rgba(37, 48, 71, 0.1);
    }

    .card.active {
      display: block;
    }

    .tag {
      margin: 0 0 8px;
      color: #0f766e;
      font-size: 16px;
      font-weight: 900;
    }

    h2 {
      margin: 0 0 10px;
      font-size: clamp(30px, 4vw, 44px);
      letter-spacing: 0;
    }

    .prompt {
      margin: 0 0 24px;
      color: var(--soft);
      font-size: 22px;
      line-height: 1.35;
    }

    button {
      border: 0;
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      cursor: pointer;
      font: inherit;
      transition: transform 120ms ease, outline-color 120ms ease;
      touch-action: manipulation;
    }

    button:disabled {
      cursor: default;
      opacity: 0.5;
    }

    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .choice {
      min-height: 166px;
      padding: 18px;
      border: 2px solid var(--line);
      box-shadow: 0 8px 22px rgba(37, 48, 71, 0.08);
      font-size: 24px;
      font-weight: 900;
    }

    .icon {
      display: block;
      margin-bottom: 10px;
      font-size: 72px;
      line-height: 1;
    }

    .sort-area {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 22px;
    }

    .sort-button {
      min-height: 220px;
      border: 2px solid var(--line);
      display: grid;
      place-items: center;
      padding: 18px;
      font-size: 26px;
      font-weight: 900;
    }

    .big-face {
      font-size: 94px;
      line-height: 1;
    }

    .wash-panel {
      display: grid;
      place-items: center;
      min-height: 275px;
      margin-top: 18px;
      border: 2px dashed var(--line);
      border-radius: 8px;
      background: #f8fafc;
      text-align: center;
    }

    .bubble {
      display: inline-grid;
      place-items: center;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(96, 165, 250, 0.2);
      font-size: 72px;
      animation: float 1.2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    .feedback {
      min-height: 52px;
      margin: 18px 0 0;
      font-size: 24px;
      font-weight: 900;
      color: #0f766e;
    }

    .feedback.try {
      color: #b45309;
    }

    nav {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-top: 18px;
    }

    .nav-button {
      min-width: 120px;
      min-height: 54px;
      padding: 0 18px;
      color: white;
      background: #253047;
      font-weight: 900;
    }

    .nav-button.secondary {
      color: var(--ink);
      background: #fff;
      border: 2px solid var(--line);
    }

    .done {
      display: grid;
      place-items: center;
      min-height: 360px;
      text-align: center;
    }

    .medal {
      width: 160px;
      height: 160px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--yellow);
      font-size: 82px;
      box-shadow: 0 16px 30px rgba(250, 204, 21, 0.28);
    }

    @media (max-width: 720px) {
      main {
        padding: 16px;
      }

      header {
        align-items: start;
        flex-direction: column;
      }

      .card {
        min-height: auto;
      }

      .grid,
      .sort-area {
        grid-template-columns: 1fr;
      }

      .choice,
      .sort-button {
        min-height: 138px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>生活小帮手</h1>
        <p class="subtitle">6 个日常小任务：穿衣、刷牙、收纳、情绪和安全。</p>
      </div>
      <div class="counter" id="counter">1 / 7</div>
    </header>

    <section class="card active">
      <p class="tag">第 1 课 · 穿衣</p>
      <h2>下雨天穿什么？</h2>
      <p class="prompt">外面下雨啦，请帮小朋友选雨具。</p>
      <div class="grid">
        <button class="choice" data-good="no"><span class="icon">🩴</span>拖鞋</button>
        <button class="choice" data-good="yes"><span class="icon">☔️</span>雨伞</button>
        <button class="choice" data-good="no"><span class="icon">🧢</span>帽子</button>
      </div>
      <div class="feedback" aria-live="polite"></div>
    </section>

    <section class="card">
      <p class="tag">第 2 课 · 刷牙</p>
      <h2>牙刷在哪里？</h2>
      <p class="prompt">睡觉前，要找到牙刷刷一刷。</p>
      <div class="grid">
        <button class="choice" data-good="yes"><span class="icon">🪥</span>牙刷</button>
        <button class="choice" data-good="no"><span class="icon">🥄</span>勺子</button>
        <button class="choice" data-good="no"><span class="icon">🧦</span>袜子</button>
      </div>
      <div class="feedback" aria-live="polite"></div>
    </section>

    <section class="card">
      <p class="tag">第 3 课 · 收纳</p>
      <h2>玩具放哪里？</h2>
      <p class="prompt">玩完积木，把玩具送回家。</p>
      <div class="sort-area">
        <button class="sort-button" data-good="yes"><span><span class="icon">🧺</span>玩具篮</span></button>
        <button class="sort-button" data-good="no"><span><span class="icon">🛏️</span>床上</span></button>
      </div>
      <div class="feedback" aria-live="polite"></div>
    </section>

    <section class="card">
      <p class="tag">第 4 课 · 情绪</p>
      <h2>谁很开心？</h2>
      <p class="prompt">找一找笑眯眯的小脸。</p>
      <div class="grid">
        <button class="choice" data-good="no"><span class="big-face">😢</span><br>难过</button>
        <button class="choice" data-good="yes"><span class="big-face">😊</span><br>开心</button>
        <button class="choice" data-good="no"><span class="big-face">😴</span><br>困了</button>
      </div>
      <div class="feedback" aria-live="polite"></div>
    </section>

    <section class="card">
      <p class="tag">第 5 课 · 洗手</p>
      <h2>小手搓一搓</h2>
      <p class="prompt">和泡泡一起洗手，点一下泡泡。</p>
      <button class="wash-panel" data-action="wash">
        <span>
          <span class="bubble">🫧</span>
          <span class="icon">👏</span>
        </span>
      </button>
      <div class="feedback" aria-live="polite"></div>
    </section>

    <section class="card">
      <p class="tag">第 6 课 · 安全</p>
      <h2>过马路看哪里？</h2>
      <p class="prompt">过马路前，要看红绿灯。</p>
      <div class="grid">
        <button class="choice" data-good="no"><span class="icon">🍪</span>饼干</button>
        <button class="choice" data-good="yes"><span class="icon">🚦</span>红绿灯</button>
        <button class="choice" data-good="no"><span class="icon">🎈</span>气球</button>
      </div>
      <div class="feedback" aria-live="polite"></div>
    </section>

    <section class="card">
      <p class="tag">完成</p>
      <h2>今天帮忙成功</h2>
      <div class="done">
        <div>
          <div class="medal">✓</div>
          <p class="prompt">小帮手完成啦，可以和大人击掌。</p>
        </div>
      </div>
      <div class="feedback" aria-live="polite"></div>
    </section>

    <nav>
      <button class="nav-button secondary" id="prev">上一步</button>
      <button class="nav-button" id="next">下一步</button>
    </nav>
  </main>

  <script>
    const cards = Array.from(document.querySelectorAll(".card"));
    const counter = document.getElementById("counter");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    let current = 0;

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const voice = new SpeechSynthesisUtterance(text);
      voice.lang = "zh-CN";
      voice.rate = 0.86;
      speechSynthesis.speak(voice);
    }

    function show(index) {
      current = Math.max(0, Math.min(index, cards.length - 1));
      cards.forEach((card, cardIndex) => {
        card.classList.toggle("active", cardIndex === current);
      });
      counter.textContent = `${current + 1} / ${cards.length}`;
      prev.disabled = current === 0;
      next.textContent = current === cards.length - 1 ? "再玩一遍" : "下一步";
    }

    function feedback(target, text, retry = false) {
      const card = target.closest(".card");
      const box = card.querySelector(".feedback");
      box.textContent = text;
      box.classList.toggle("try", retry);
      speak(text);
    }

    function reset() {
      cards.forEach((card) => {
        card.querySelector(".feedback").textContent = "";
        card.querySelectorAll("button").forEach((button) => {
          button.style.outline = "";
        });
      });
    }

    document.querySelectorAll("[data-good]").forEach((button) => {
      button.addEventListener("click", () => {
        if (button.dataset.good === "yes") {
          feedback(button, "选对啦！你真会帮忙。");
          button.style.outline = "5px solid rgba(52, 211, 153, 0.45)";
        } else {
          feedback(button, "再看一看。", true);
          button.style.outline = "5px solid rgba(250, 204, 21, 0.45)";
        }
      });
    });

    document.querySelector("[data-action='wash']").addEventListener("click", (event) => {
      feedback(event.currentTarget, "搓一搓，冲一冲，小手干净啦。");
    });

    prev.addEventListener("click", () => show(current - 1));
    next.addEventListener("click", () => {
      if (current === cards.length - 1) {
        reset();
        show(0);
        return;
      }
      show(current + 1);
    });

    show(0);
  </script>
</body>
</html>
